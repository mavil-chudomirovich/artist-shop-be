          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: List wards of a province
      tags:
      - Divisions
  /products:
    get:
      description: Returns a page of the visible catalogue — on sale, or announced
        as a pre-order, in a category on display — ordered by the operator's position.
        The optional category filter narrows the list by category slug; a hidden or
        unknown slug answers an empty list. No session is required.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      - description: Category slug to narrow the list to
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PublicProductResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      summary: List the products a customer can see
      tags:
      - Product
  /products/{slug}:
    get:
      description: Returns one visible product with its description and every picture.
        A hidden, retired, removed or unknown slug answers the same not-found. No
        session is required.
      parameters:
      - description: Product slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PublicProductDetailResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      summary: Read one product by slug
      tags:
      - Product
  /users/{userId}:
    get:
      description: Read-only operator view of one customer. Reachable only by an ADMIN
        account; every successful read is audited.
      parameters:
      - description: Account identifier of the customer being read
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
