          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Create an address
      tags:
      - User
  /users/me/addresses/{addressId}:
    delete:
      description: Hides an owned address. The row survives so past orders keep the
        address text they used.
      parameters:
      - description: Address identifier
        in: path
        name: addressId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Delete an address
      tags:
      - User
    patch:
      consumes:
      - application/json
      description: Edits an owned address and preserves its default flag. An address
        of another account answers 404.
      parameters:
      - description: Address identifier
        in: path
        name: addressId
        required: true
        type: string
      - description: Address update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.UpdateAddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.AddressResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Update an address
      tags:
      - User
  /users/me/addresses/{addressId}/default:
    post:
      description: Makes one owned address the account's single default.
      parameters:
      - description: Address identifier
        in: path
        name: addressId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.AddressResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Set the default address
      tags:
      - User
  /users/me/avatar:
    delete:
      description: Releases the stored avatar reference. The profile itself is unchanged
        otherwise.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.ProfileResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Remove the avatar
      tags:
      - User
    post:
      consumes:
      - multipart/form-data
      description: Stores an image as the account's avatar. The content is validated
        by signature, not by name or declared media type.
      parameters:
      - description: Avatar image (JPEG, PNG or WebP)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.ProfileResponse'
