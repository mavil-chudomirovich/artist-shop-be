      - BearerAuth: []
      summary: Read the payment state of the caller's order
      tags:
      - payments
    post:
      description: Creates a provider payment request for the order's exact total
        and returns the link the customer pays through. When a live payment already
        exists for the order it is reused and the same link is returned. The order
        must belong to the caller and must be awaiting payment; a provider refusal
        leaves the order unchanged.
      parameters:
      - description: Order identifier
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_payment_presentation_dto.PaymentResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Start (or reuse) an online payment for the caller's order
      tags:
      - payments
  /payments/payos/webhook:
    post:
      consumes:
      - application/json
      description: Public provider callback. The signature is verified over the exact
        received body before anything is trusted; a handled event answers 2xx so PayOS
        stops retrying. An unverified signature applies nothing, an unknown order
        code is acknowledged with nothing recorded, and an amount mismatch is recorded
        for the operator.
      parameters:
      - description: PayOS webhook envelope {code, desc, success, data, signature}
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      summary: PayOS payment webhook
      tags:
      - webhooks
  /products:
    get:
      description: Returns a page of the visible catalogue — one entry per product,
        ordered by the operator's position. A product appears only when at least one
        of its variants is on sale; the card price is the lowest on-sale variant price
        and the image is the default variant's image. The optional category filter
        narrows the list by category slug; a hidden or unknown slug answers an empty
        list. No session is required.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      - description: Category slug to narrow the list to
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PublicProductResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      summary: List the catalogue a customer can see
      tags:
      - Product
  /products/{code}:
    get:
      description: Returns one visible product with its description, gallery and its
        visible variants (on sale or out of stock), each with name, effective price
        and stock status. A hidden, removed or unknown code answers the same not-found.
        No session is required.
      parameters:
      - description: Product code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PublicProductDetailResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      summary: Read one product by code (with its variants)
      tags:
      - Product
  /users/{userId}:
    get:
      description: Read-only operator view of one customer. Reachable only by an ADMIN
        account; every successful read is audited.
      parameters:
      - description: Account identifier of the customer being read
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.CustomerLookupResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Look up a customer (ADMIN)
      tags:
      - User
  /users/me:
    get:
      description: Returns the profile of the account behind the access token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.ProfileResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Get the signed-in customer's profile
      tags:
      - User
    patch:
      consumes:
      - application/json
      description: Changes the display name and/or the phone. An omitted member keeps
        its value; an empty string clears a settable member.
      parameters:
      - description: Profile update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.ProfileResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Update the signed-in customer's profile
      tags:
      - User
  /users/me/addresses:
    get:
      description: Returns a page of the account's non-hidden addresses. Pagination
        is reported in meta.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.AddressResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: List the account's addresses
      tags:
      - User
    post:
      consumes:
      - application/json
      description: Stores a new shipping address. Province and ward codes must exist
        in the official dataset.
      parameters:
      - description: Address payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.CreateAddressRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.AddressResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "429":
