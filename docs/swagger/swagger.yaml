  /categories:
    get:
      description: Returns a page of the categories the operator has left on display,
        in the configured order. No session is required.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.PublicCategoryResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      summary: List the categories on display
      tags:
      - Category
  /categories/{slug}:
    get:
      description: Returns one category on display, addressed by its slug. A withheld,
        removed or unknown slug answers the same not-found. No session is required.
      parameters:
      - description: Category slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.PublicCategoryResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      summary: Read one displayed category by slug
      tags:
      - Category
  /divisions/provinces:
    get:
      description: Returns every first-level administrative unit of the official dataset,
        ordered by name.
