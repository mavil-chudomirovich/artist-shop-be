basePath: /api/v1
definitions:
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
      refreshToken:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.EmailRequest:
    properties:
      email:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.IdentityResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.LoginRequest:
    properties:
      email:
        type: string
      identifier:
        type: string
      password:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.RegisterRequest:
    properties:
      displayName:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.ResetRequest:
    properties:
      newPassword:
        type: string
      token:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.SessionResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.TokenRequest:
    properties:
      refreshToken:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.VerifyEmailRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.AddItemRequest:
    properties:
      productId:
        description: ProductID is the product to add.
        type: string
      quantity:
        description: Quantity is the positive whole number of units to add.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.CartLineResponse:
    properties:
      availableQuantity:
        description: |-
          AvailableQuantity is the currently available amount, present only when the
          line is on sale but short of its quantity.
        type: integer
      buyable:
        description: Buyable reports whether the line can be bought as it stands.
        type: boolean
      lineTotal:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.MoneyResponse'
        description: LineTotal is quantity times the captured price.
      name:
        description: Name is the product's current name, or null when the product
          is gone.
        type: string
      productId:
        description: ProductID is the product the line is for.
        type: string
      quantity:
        description: Quantity is the whole number the customer chose.
        type: integer
      slug:
        description: |-
          Slug is the product's current link segment, or null when the product is
          gone.
        type: string
      unitPrice:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.MoneyResponse'
        description: UnitPrice is the captured price.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.CartResponse:
    properties:
      lines:
        description: |-
          Lines is one entry per product the customer added; an empty cart is an
          empty array.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.CartLineResponse'
        type: array
      subtotal:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.MoneyResponse'
        description: Subtotal is the cart total, or null when the cart is empty.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.MoneyResponse:
    properties:
      amount:
        description: Amount is the amount in the currency's minor unit.
        type: integer
      currency:
        description: Currency is the currency code.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.QuantityRequest:
    properties:
      quantity:
        description: Quantity is the new positive whole number for the line.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.AdminCategoryResponse:
    properties:
      createdAt:
        description: CreatedAt is when the category was created.
        type: string
      description:
        description: Description is the text shown to customers; it may be empty.
        type: string
      id:
        description: ID is the category's stable identifier.
        type: string
      isVisible:
        description: IsVisible reports whether a customer can see the category.
        type: boolean
      name:
        description: Name is the name the operator wrote.
        type: string
      position:
        description: Position is the operator's ordering preference.
        type: integer
      slug:
        description: Slug is the link segment the operator wrote.
        type: string
      updatedAt:
        description: UpdatedAt is when the category was last written.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.CreateCategoryRequest:
    properties:
      description:
        description: |-
          Description is optional; an omitted or empty description is stored as
          empty.
        type: string
      name:
        description: Name is required; it is trimmed before it is stored.
        type: string
      position:
        description: |-
          Position is optional and defaults to zero. Any whole number, including
          zero and negative, is valid.
        type: integer
      slug:
        description: Slug is required; it must be URL-safe and is never derived from
          the name.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.PublicCategoryResponse:
    properties:
      description:
        description: Description may be empty; an empty description is valid.
        type: string
      id:
        description: ID is the category's stable public identifier.
        type: string
      name:
        description: Name is the name the operator wrote.
        type: string
      slug:
        description: Slug is the segment a customer-facing link is built from.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.UpdateCategoryRequest:
    properties:
      description:
        description: Description is the new description; nil keeps the current value.
        type: string
      isVisible:
        description: |-
          IsVisible is the requested display state; nil keeps the current value. It
          is routed to the hide or show transition, never assigned directly.
        type: boolean
      name:
        description: Name is the new name; nil keeps the current value.
        type: string
      position:
        description: Position is the new position; nil keeps the current value.
        type: integer
      slug:
        description: Slug is the new slug; nil keeps the current value.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.AdjustmentRequest:
    properties:
      note:
        description: Note is an optional free-text note for the correction.
        type: string
      quantity:
        description: Quantity is the counted value; zero is valid.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.MovementResponse:
    properties:
      actorId:
        description: |-
          ActorID is the administrator who made a manual change, or null for a
          system-caused sale.
        type: string
      createdAt:
        description: CreatedAt is when the movement was written.
        type: string
      delta:
        description: Delta is the signed change.
        type: integer
      id:
        description: ID identifies the movement.
        type: string
      kind:
        description: 'Kind is the kind of change: RESTOCK, DAMAGE, ADJUSTMENT or SALE.'
        type: string
      note:
        description: Note is the optional note a manual change carries, or null.
        type: string
      productId:
        description: ProductID is the product whose quantity changed.
        type: string
      resultingQuantity:
        description: ResultingQuantity is the physical quantity after the change.
        type: integer
      sourceReference:
        description: |-
          SourceReference is the outside event's identity, or null for a manual
          change.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.QuantityRequest:
    properties:
      note:
        description: Note is an optional free-text note for the change.
        type: string
      quantity:
        description: Quantity is the positive whole number received or lost.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.StockResponse:
    properties:
      availableQuantity:
        description: 'AvailableQuantity is the difference: what a customer can take.'
        type: integer
      heldQuantity:
        description: HeldQuantity is what active holds have set aside.
        type: integer
      physicalQuantity:
        description: PhysicalQuantity is what is on the shelf.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.AdminOrderResponse:
    properties:
      address:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderAddressResponse'
        description: Address is the delivery address snapshot.
      createdAt:
        description: CreatedAt is when the order was placed.
        type: string
      id:
        description: ID identifies the order.
        type: string
      itemCount:
        description: ItemCount is how many lines the order carries.
        type: integer
      lines:
        description: Lines are the order's snapshot lines, in position order.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderLineResponse'
        type: array
      status:
        description: Status is where the order is in its life.
        type: string
      total:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse'
        description: Total is the committed total.
      userId:
        description: UserID is the account that owns the order.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.AdminOrderSummaryResponse:
    properties:
      createdAt:
        description: CreatedAt is when the order was placed.
        type: string
      id:
        description: ID identifies the order.
        type: string
      itemCount:
        description: ItemCount is how many lines the order carries.
        type: integer
      status:
        description: Status is where the order is in its life.
        type: string
      total:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse'
        description: Total is the committed total.
      userId:
        description: UserID is the account that owns the order.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.CheckoutRequest:
    properties:
      addressId:
        description: AddressID is the address the customer named, or nil to use the
          default.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse:
    properties:
      amount:
        description: Amount is the amount in the currency's minor unit.
        type: integer
      currency:
        description: Currency is the currency code.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderAddressResponse:
    properties:
      provinceCode:
        description: ProvinceCode and ProvinceName identify the first-level unit.
        type: string
      provinceName:
        type: string
      recipientName:
        description: RecipientName is the person the order goes to.
        type: string
      recipientPhone:
        description: RecipientPhone is the normalised recipient phone number.
        type: string
      streetAddress:
        description: StreetAddress is the free-text house number and street.
        type: string
      wardCode:
        description: WardCode and WardName identify the second-level unit.
        type: string
      wardName:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderLineResponse:
    properties:
      lineTotal:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse'
        description: LineTotal is quantity times the snapshot unit price.
      name:
        description: Name is the product's name at checkout.
        type: string
      productId:
        description: ProductID is the product recorded on the line.
        type: string
      quantity:
        description: Quantity is the whole number bought.
        type: integer
      slug:
        description: Slug is the product's link segment at checkout.
        type: string
      unitPrice:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse'
        description: UnitPrice is the snapshot unit price.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderResponse:
    properties:
      address:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderAddressResponse'
        description: Address is the delivery address snapshot.
      createdAt:
        description: CreatedAt is when the order was placed.
        type: string
      id:
        description: ID identifies the order.
        type: string
      itemCount:
        description: ItemCount is how many lines the order carries.
        type: integer
      lines:
        description: Lines are the order's snapshot lines, in position order.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderLineResponse'
        type: array
      status:
        description: Status is where the order is in its life.
        type: string
      total:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse'
        description: Total is the committed total.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderSummaryResponse:
    properties:
      createdAt:
        description: CreatedAt is when the order was placed.
        type: string
      id:
        description: ID identifies the order.
        type: string
      itemCount:
        description: ItemCount is how many lines the order carries.
        type: integer
      status:
        description: Status is where the order is in its life.
        type: string
      total:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse'
        description: Total is the committed total.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.TransferRequest:
    properties:
      email:
        description: Email is the recipient account's email.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.AdminImageResponse:
    properties:
      height:
        type: integer
      id:
        description: ID identifies the picture.
        type: string
      isPrimary:
        description: IsPrimary reports whether this is the product's main picture.
        type: boolean
      position:
        description: Position is the display order.
        type: integer
      publicId:
        description: PublicID is the provider's opaque identifier.
        type: string
      url:
        description: URL is the displayable link.
        type: string
      width:
        description: Width and Height are the stored pixel dimensions.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.AdminProductDetailResponse:
    properties:
      categoryId:
        description: CategoryID is the one category the product belongs to.
        type: string
      createdAt:
        description: CreatedAt and UpdatedAt are the stored timestamps.
        type: string
      description:
        description: Description is the text shown to customers; an empty string is
          valid.
        type: string
      id:
        description: ID is the product's stable identifier.
        type: string
      imageCount:
        description: ImageCount is how many pictures the product has.
        type: integer
      imageUrl:
        description: ImageURL is the main picture's link, or null when the product
          has none.
        type: string
      images:
        description: |-
          Images holds every picture in display order. It is always an array, never
          null.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.AdminImageResponse'
        type: array
      isPreorder:
        description: IsPreorder reports whether the product is announced as a pre-order.
        type: boolean
      isSet:
        description: IsSet reports whether the product is a combo set (FR-039).
        type: boolean
      members:
        description: |-
          Members holds the products inside a set, in order. It is omitted for a
          product that is not a set.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.SetMemberResponse'
        type: array
      name:
        description: Name is the name the operator wrote.
        type: string
      position:
        description: Position is the operator's ordering preference.
        type: integer
      preorderExpectedAt:
        description: |-
          PreorderExpectedAt is the optional expected availability date, or null. It
          is written in the contract's date-only form (format: date).
        type: string
      price:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PriceResponse'
        description: Price is the integer amount with its currency.
      sellState:
        description: SellState is where the product is in its selling life (FR-022).
        type: string
      slug:
        description: Slug is the link segment the operator wrote.
        type: string
      updatedAt:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.AdminProductResponse:
    properties:
      categoryId:
        description: CategoryID is the one category the product belongs to.
        type: string
      createdAt:
        description: CreatedAt and UpdatedAt are the stored timestamps.
        type: string
      description:
        description: Description is the text shown to customers; an empty string is
          valid.
        type: string
      id:
        description: ID is the product's stable identifier.
        type: string
      imageCount:
        description: ImageCount is how many pictures the product has.
        type: integer
      imageUrl:
        description: ImageURL is the main picture's link, or null when the product
          has none.
        type: string
      isPreorder:
        description: IsPreorder reports whether the product is announced as a pre-order.
        type: boolean
      isSet:
        description: IsSet reports whether the product is a combo set (FR-039).
        type: boolean
      name:
        description: Name is the name the operator wrote.
        type: string
      position:
        description: Position is the operator's ordering preference.
        type: integer
      preorderExpectedAt:
        description: |-
          PreorderExpectedAt is the optional expected availability date, or null. It
          is written in the contract's date-only form (format: date).
        type: string
      price:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PriceResponse'
        description: Price is the integer amount with its currency.
      sellState:
        description: SellState is where the product is in its selling life (FR-022).
        type: string
      slug:
        description: Slug is the link segment the operator wrote.
        type: string
      updatedAt:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.ChangeStateRequest:
    properties:
      to:
        description: |-
          To is the requested target state. It must be one of the four sell states;
          the use case validates it and reports an unknown value against this member,
          which is why it is a string here rather than the domain enum.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.CreateProductRequest:
    properties:
      categoryId:
        description: CategoryID is the one category the product belongs to.
        type: string
      description:
        description: |-
          Description is the text shown to customers; an omitted or empty value is
          stored empty.
        type: string
      isPreorder:
        description: |-
          IsPreorder reports whether the product is announced as a pre-order
          (FR-040, research D9). A created product is COMING_SOON, so the label may
          always be set here; the domain refuses it only once the product is on sale.
        type: boolean
      isSet:
        description: IsSet reports whether the product is a combo set (FR-039, research
          D10).
        type: boolean
      memberProductIds:
        description: |-
          MemberProductIDs are the products inside the set, in the order they are
          listed. They are recorded only when IsSet is true (research D10).
        items:
          type: string
        type: array
      name:
        description: Name is the product name.
        type: string
      position:
        description: Position is the ordering preference.
        type: integer
      preorderExpectedAt:
        description: |-
          PreorderExpectedAt is the optional expected-availability date, in the
          contract's date-only form. It is meaningful only together with IsPreorder.
        type: string
      price:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PriceRequest'
        description: Price is the price with its currency.
      slug:
        description: Slug is the public link segment.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PriceRequest:
    properties:
      amount:
        description: Amount is the price in the currency's minor unit.
        type: integer
      currency:
        description: 'Currency is the currency code: exactly three uppercase letters.'
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PriceResponse:
    properties:
      amount:
        description: Amount is the price in the currency's minor unit.
        type: integer
      currency:
        description: 'Currency is the currency code: exactly three uppercase letters.'
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PublicImageResponse:
    properties:
      height:
        type: integer
      id:
        description: ID identifies the picture.
        type: string
      url:
        description: URL is the displayable link returned by the provider.
        type: string
      width:
        description: Width and Height are the stored pixel dimensions.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PublicProductDetailResponse:
    properties:
      description:
        description: Description may be empty; an empty description is valid.
        type: string
      id:
        description: ID is the product's stable public identifier.
        type: string
      imageUrl:
        description: ImageURL is the main picture's link, or null when the product
          has none.
        type: string
      images:
        description: |-
          Images holds every picture in display order. It is always an array, never
          null, so a product with no picture answers `[]`.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PublicImageResponse'
        type: array
      isPreorder:
        description: |-
          IsPreorder reports whether the product is announced but not yet available.
          Such a product is visible and not buyable (FR-002, FR-040).
        type: boolean
      name:
        description: Name is the name the operator wrote.
        type: string
      price:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PriceResponse'
        description: Price is the integer amount with its currency.
      slug:
        description: Slug is the segment a customer-facing link is built from.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PublicProductResponse:
    properties:
      id:
        description: ID is the product's stable public identifier.
        type: string
      imageUrl:
        description: ImageURL is the main picture's link, or null when the product
          has none.
        type: string
      isPreorder:
        description: |-
          IsPreorder reports whether the product is announced but not yet available.
          Such a product is visible and not buyable (FR-002, FR-040).
        type: boolean
      name:
        description: Name is the name the operator wrote.
        type: string
      price:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PriceResponse'
        description: Price is the integer amount with its currency.
      slug:
        description: Slug is the segment a customer-facing link is built from.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.SetMemberResponse:
    properties:
      id:
        description: ID is the member product's identifier.
        type: string
      name:
        description: Name is the member product's name.
        type: string
      slug:
        description: Slug is the member product's public link segment.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.UpdateProductRequest:
    properties:
      categoryId:
        description: CategoryID is the new category; nil keeps the current value.
        type: string
      description:
        description: |-
          Description is the new description; nil keeps the current value, an empty
          string clears it.
        type: string
      isPreorder:
        description: |-
          IsPreorder is the new pre-order label; nil keeps the current value. Setting
          it false also clears PreorderExpectedAt (FR-040). The domain refuses
          setting it true while the product is on sale, naming isPreorder.
        type: boolean
      isSet:
        description: IsSet is the new combo-set flag; nil keeps the current value.
        type: boolean
      memberProductIds:
        description: |-
          MemberProductIDs replaces the whole member list when non-nil. It is
          recorded only when the product is a set (research D10); sending an empty
          list clears the set's members.
        items:
          type: string
        type: array
      name:
        description: Name is the new name; nil keeps the current value.
        type: string
      position:
        description: Position is the new position; nil keeps the current value.
        type: integer
      preorderExpectedAt:
        description: |-
          PreorderExpectedAt is the new expected-availability date, in the
          contract's date-only form; nil keeps the current value.
        type: string
      price:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_product_presentation_dto.PriceRequest'
        description: Price is the new price; nil keeps the current value.
      slug:
        description: Slug is the new slug; nil keeps the current value.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.AddressResponse:
    properties:
      divisionNeedsReview:
        description: |-
          DivisionNeedsReview is true when a stored code is no longer in the official
          dataset; the captured names are still returned so the customer can see what
          was saved.

          It is always stated, false included: the customer's own list knows the
          answer, because the use case checks every stored code against the dataset.
          Omitting a known false would make a client read "absent" as "unknown",
          which in JavaScript is `undefined` rather than `false`.
        type: boolean
      id:
        description: ID identifies the address.
        type: string
      isDefault:
        description: IsDefault reports whether this is the account's default address.
        type: boolean
      provinceCode:
        description: ProvinceCode is the stored first-level administrative unit.
        type: string
      provinceName:
        description: ProvinceName is the display name captured at save time.
        type: string
      recipientName:
        description: RecipientName is the person the order goes to.
        type: string
      recipientPhone:
        description: RecipientPhone is the normalised recipient phone number.
        type: string
      streetAddress:
        description: StreetAddress is the free-text house number and street.
        type: string
      wardCode:
        description: WardCode is the stored second-level administrative unit.
        type: string
      wardName:
        description: WardName is the display name captured at save time.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.AvatarResponse:
    properties:
      height:
        description: Height is the stored height.
        type: integer
      publicId:
        description: PublicID is the media provider's opaque identifier.
        type: string
      url:
        description: URL is the displayable link.
        type: string
      width:
        description: Width is the stored width, at most 512.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.CreateAddressRequest:
    properties:
      provinceCode:
        description: ProvinceCode must exist in the official dataset.
        type: string
      provinceName:
        description: ProvinceName is optional; captured when omitted.
        type: string
      recipientName:
        description: RecipientName is the person the order goes to.
        type: string
      recipientPhone:
        description: RecipientPhone is the recipient phone number.
        type: string
      streetAddress:
        description: StreetAddress is the free-text house number and street.
        type: string
      wardCode:
        description: WardCode must exist and belong to ProvinceCode.
        type: string
      wardName:
        description: WardName is optional; captured when omitted.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.CustomerLookupResponse:
    properties:
      addresses:
        description: |-
          Addresses holds the customer's non-hidden addresses, default first and then
          most recently updated. They are the operator type, which carries no
          divisionNeedsReview member.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.OperatorAddressResponse'
        type: array
      displayName:
        description: DisplayName may be empty when the customer never set one.
        type: string
      email:
        description: Email is the account email.
        type: string
      id:
        description: ID identifies the account.
        type: string
      phone:
        description: Phone is null when unset.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_access.Role'
        description: Role is CUSTOMER or ADMIN.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.OperatorAddressResponse:
    properties:
      id:
        description: ID identifies the address.
        type: string
      isDefault:
        description: IsDefault reports whether the account's default address.
        type: boolean
      provinceCode:
        description: ProvinceCode is the stored first-level administrative unit.
        type: string
      provinceName:
        description: ProvinceName is the display name captured at save time.
        type: string
      recipientName:
        description: RecipientName is the person the order goes to.
        type: string
      recipientPhone:
        description: RecipientPhone is the normalised recipient phone number.
        type: string
      streetAddress:
        description: StreetAddress is the free-text house number and street.
        type: string
      wardCode:
        description: WardCode is the stored second-level administrative unit.
        type: string
      wardName:
        description: WardName is the display name captured at save time.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.ProfileResponse:
    properties:
      avatar:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.AvatarResponse'
        description: Avatar is null when the customer has no photo.
      displayName:
        description: DisplayName may be empty when the customer never set one.
        type: string
      email:
        description: Email is the account email.
        type: string
      id:
        description: ID is the account identifier.
        type: string
      phone:
        description: Phone is null when unset.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_access.Role'
        description: Role is CUSTOMER or ADMIN.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.ProvinceResponse:
    properties:
      code:
        description: Code is the stable identifier stored on an address.
        type: string
      name:
        description: Name is the display name.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.UpdateAddressRequest:
    properties:
      provinceCode:
        description: ProvinceCode is omitted to keep the current province.
        type: string
      provinceName:
        description: ProvinceName is optional; recaptured when the province changes.
        type: string
      recipientName:
        description: RecipientName is omitted to keep the current value.
        type: string
      recipientPhone:
        description: RecipientPhone is omitted to keep the current value.
        type: string
      streetAddress:
        description: StreetAddress is omitted to keep the current street address.
        type: string
      wardCode:
        description: WardCode is omitted to keep the current ward.
        type: string
      wardName:
        description: WardName is optional; recaptured when the ward changes.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.UpdateProfileRequest:
    properties:
      displayName:
        description: DisplayName is omitted to keep the current value, empty to clear
          it.
        type: string
      phone:
        description: Phone is omitted to keep the current value, empty or null to
          clear it.
        items:
          type: integer
        type: array
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_user_presentation_dto.WardResponse:
    properties:
      code:
        description: Code is the stable identifier stored on an address.
        type: string
      name:
        description: Name is the display name.
        type: string
      provinceCode:
        description: ProvinceCode is the owning province, so a consumer never has
          to join back.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_share_access.Role:
    enum:
    - CUSTOMER
    - ADMIN
    type: string
    x-enum-varnames:
    - RoleCustomer
    - RoleAdmin
  github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.Detail:
    properties:
      field:
        type: string
      issue:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.ErrorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.Detail'
        type: array
      message:
        type: string
      requestId:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.Meta:
    properties:
      page:
        type: integer
      pageSize:
        type: integer
      requestId:
        type: string
      timestamp:
        type: string
      total:
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError:
    properties:
      error:
        $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.ErrorBody'
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.Meta'
    type: object
info:
  contact: {}
  description: |-
    Modular-monolith backend for the artist shop.
    Every business endpoint is mounted under /api/v1 and uses the shared success/error envelope.
  title: Artist Shop API
  version: "1.0"
paths:
  /admin/categories:
    get:
      description: Returns a page of every category, including the ones not on display,
        with the position and display state a customer never sees.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.AdminCategoryResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: List every category (ADMIN)
      tags:
      - Category
    post:
      consumes:
      - application/json
      description: Creates a category on display. The acting administrator comes from
        the session, never the body.
      parameters:
      - description: Category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.AdminCategoryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Create a category (ADMIN)
      tags:
      - Category
  /admin/categories/{categoryId}:
    delete:
      description: Removes a category. A category that still has products cannot be
        removed.
      parameters:
      - description: Category identifier
        in: path
        name: categoryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Delete a category (ADMIN)
      tags:
      - Category
    get:
      description: Returns one category, including one not on display. A malformed
        identifier is a request error with the field named; an unknown one is not-found.
      parameters:
      - description: Category identifier
        in: path
        name: categoryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.AdminCategoryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Read one category by identifier (ADMIN)
      tags:
      - Category
    patch:
      consumes:
      - application/json
      description: Applies a partial edit (name, slug, description, position and display
        state). An omitted member keeps its value.
      parameters:
      - description: Category identifier
        in: path
        name: categoryId
        required: true
        type: string
      - description: Category update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.AdminCategoryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Update a category (ADMIN)
      tags:
      - Category
  /admin/inventory/{productId}:
    get:
      description: Returns the physical quantity, the quantity currently held for
        orders being paid, and what remains available. A product that does not exist
        answers not-found; one that exists but has never been stocked answers zero.
      parameters:
      - description: Product identifier
        in: path
        name: productId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.StockResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Read a product's stock (ADMIN)
      tags:
      - Inventory
  /admin/inventory/{productId}/adjustment:
    post:
      consumes:
      - application/json
      description: Sets the product's physical quantity to a recounted value and records
        only the difference. Correcting to the stored value changes nothing and writes
        no ledger entry; zero is a valid counted value.
      parameters:
      - description: Product identifier
        in: path
        name: productId
        required: true
        type: string
      - description: Counted quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.AdjustmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.StockResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Correct the physical quantity (ADMIN)
      tags:
      - Inventory
  /admin/inventory/{productId}/damage:
    post:
      consumes:
      - application/json
      description: Decreases the product's physical quantity by a positive amount.
        A decrease over the shelf, or below what is held, is refused and changes nothing.
      parameters:
      - description: Product identifier
        in: path
        name: productId
        required: true
        type: string
      - description: Quantity to remove
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.QuantityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
