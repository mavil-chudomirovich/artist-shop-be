          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Read one category by identifier (ADMIN)
      tags:
      - Category
    patch:
      consumes:
      - application/json
      description: Applies a partial edit (name, slug, description, position and display
        state). An omitted member keeps its value.
      parameters:
      - description: Category identifier
        in: path
        name: categoryId
        required: true
        type: string
      - description: Category update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.AdminCategoryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Update a category (ADMIN)
      tags:
      - Category
  /admin/categories/reorder:
    put:
      consumes:
      - application/json
      description: 'Replaces the catalogue-wide category order with the submitted
        order. The array must contain every category exactly once; the first id becomes
        the first category. Atomic: on any refusal nothing changes. The acting administrator
        comes from the session, never the body.'
      parameters:
      - description: Complete, ordered category ids
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.ReorderCategoriesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.ReorderResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerError'
      security:
      - BearerAuth: []
      summary: Reorder every category (ADMIN)
      tags:
      - Category
  /admin/dashboard/overview:
    get:
      description: 'Returns every dashboard section in one response: the revenue,
        order, customer and inventory KPIs, a daily revenue trend, the current-month
        category breakdown and the five newest orders. Revenue counts PAID, SHIPPING,
        DELIVERED and COMPLETED orders in VND, attributed by the order creation instant;
        calendar boundaries use the configured shop timezone. The whole request is
        read-only.'
      parameters:
      - description: Trend length in trailing calendar days (7 or 30; default 7)
        enum:
        - 7
        - 30
        in: query
        name: days
        type: integer
      - description: Inventory warning threshold (0..10000; default 5)
        in: query
        maximum: 10000
        minimum: 0
        name: lowStockThreshold
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_share_httpx.SwaggerSuccess'
            - properties:
                data:
                  $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.OverviewResponse'
