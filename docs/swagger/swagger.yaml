basePath: /api/v1
definitions:
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.CategoryShareResponse:
    properties:
      amount:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.MoneyResponse'
        description: Amount is the revenue attributed to the category.
      categoryId:
        description: CategoryID is null for an unresolved (legacy) category.
        type: string
      categoryName:
        description: CategoryName is the snapshotted name, or the unresolved label.
        type: string
      percentage:
        description: Percentage is the category's share of the window revenue.
        type: number
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.CustomerKPIResponse:
    properties:
      newUsersThisWeek:
        description: NewUsersThisWeek counts the active newcomers of the week.
        type: integer
      totalUsers:
        description: TotalUsers counts active customers all-time.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.CustomerSummaryResponse:
    properties:
      displayName:
        description: DisplayName is empty when the account never set one.
        type: string
      email:
        description: Email is the account's email.
        type: string
      id:
        description: ID identifies the account.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.InventoryKPIResponse:
    properties:
      lowStockCount:
        description: LowStockCount is the number of low-stock variants.
        type: integer
      threshold:
        description: Threshold echoes the requested threshold.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.KPIResponse:
    properties:
      customers:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.CustomerKPIResponse'
        description: Customers is the customer group.
      inventory:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.InventoryKPIResponse'
        description: Inventory is the inventory group.
      orders:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.OrderKPIResponse'
        description: Orders is the order group.
      revenue:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.RevenueKPIResponse'
        description: Revenue is the revenue group.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.MoneyResponse:
    properties:
      amount:
        description: Amount is the amount in the currency's minor unit.
        type: integer
      currency:
        description: Currency is the currency code; VND for the MVP.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.OrderKPIResponse:
    properties:
      growthPercent:
        description: GrowthPercent is null when the previous count is zero.
        type: number
      lastMonthOrders:
        description: LastMonthOrders counts the comparable previous-window orders.
        type: integer
      pendingConfirmationCount:
        description: PendingConfirmationCount counts the orders awaiting the artist.
        type: integer
      thisMonthOrders:
        description: ThisMonthOrders counts the current-window orders.
        type: integer
      totalOrders:
        description: TotalOrders is every order ever placed, every state.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.OverviewResponse:
    properties:
      categoryBreakdown:
        description: CategoryBreakdown is the current-window revenue by category.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.CategoryShareResponse'
        type: array
      kpis:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.KPIResponse'
        description: KPIs holds the four KPI groups.
      recentOrders:
        description: RecentOrders is the newest orders.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.RecentOrderResponse'
        type: array
      revenueTrend:
        description: RevenueTrend is the daily revenue series, oldest first.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.RevenuePointResponse'
        type: array
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.RecentOrderResponse:
    properties:
      createdAt:
        description: CreatedAt is when the order was placed.
        type: string
      customer:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.CustomerSummaryResponse'
        description: Customer is null when the account no longer exists.
      id:
        description: ID identifies the order.
        type: string
      itemCount:
        description: ItemCount is the number of lines.
        type: integer
      itemQuantity:
        description: ItemQuantity is the sum of the line quantities.
        type: integer
      itemSummary:
        description: ItemSummary describes the first line, or the first line plus
          a remainder.
        type: string
      status:
        description: Status is the order's stored state.
        type: string
      total:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.MoneyResponse'
        description: Total is the order total.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.RevenueKPIResponse:
    properties:
      currentMonthAmount:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.MoneyResponse'
        description: CurrentMonthAmount is the current-window revenue.
      growthPercent:
        description: GrowthPercent is null when the previous amount is zero.
        type: number
      lastMonthAmount:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.MoneyResponse'
        description: LastMonthAmount is the comparable previous-window revenue.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.RevenuePointResponse:
    properties:
      amount:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_admin_presentation_dto.MoneyResponse'
        description: Amount is that day's revenue.
      date:
        description: Date is the calendar day as YYYY-MM-DD.
        type: string
      dayLabel:
        description: DayLabel is the short label for the day.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
      refreshToken:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.EmailRequest:
    properties:
      email:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.IdentityResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.LoginRequest:
    properties:
      email:
        type: string
      identifier:
        type: string
      password:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.RegistrationIDRequest:
    properties:
      registrationId:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.RegistrationStartedResponse:
    properties:
      otpExpiresIn:
        type: integer
      registrationId:
        type: string
      resendAvailableIn:
        type: integer
      status:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.ResetRequest:
    properties:
      newPassword:
        type: string
      token:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.ResetTokenResponse:
    properties:
      expiresIn:
        type: integer
      resetToken:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.SessionResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.StartRegistrationRequest:
    properties:
      displayName:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.TokenRequest:
    properties:
      refreshToken:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.VerifyRegistrationRequest:
    properties:
      otp:
        type: string
      registrationId:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_auth_presentation_dto.VerifyResetOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.AddItemRequest:
    properties:
      quantity:
        description: Quantity is the positive whole number of units to add.
        type: integer
      variantId:
        description: VariantID is the variant to add (a product without a variant
          is refused).
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.CartLineResponse:
    properties:
      availableQuantity:
        description: |-
          AvailableQuantity is the currently available amount, present only when the
          line is on sale but short of its quantity.
        type: integer
      buyable:
        description: Buyable reports whether the line can be bought as it stands.
        type: boolean
      lineTotal:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.MoneyResponse'
        description: LineTotal is quantity times the captured price.
      productId:
        description: ProductID is the product the variant belongs to.
        type: string
      productName:
        description: |-
          ProductName is the product's current name, or null when the variant is
          gone.
        type: string
      quantity:
        description: Quantity is the whole number the customer chose.
        type: integer
      unitPrice:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.MoneyResponse'
        description: UnitPrice is the captured price.
      variantId:
        description: VariantID is the variant the line is for.
        type: string
      variantName:
        description: |-
          VariantName is the variant's current display name, or null when the variant
          is gone.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.CartResponse:
    properties:
      lines:
        description: |-
          Lines is one entry per product the customer added; an empty cart is an
          empty array.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.CartLineResponse'
        type: array
      subtotal:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.MoneyResponse'
        description: Subtotal is the cart total, or null when the cart is empty.
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.MoneyResponse:
    properties:
      amount:
        description: Amount is the amount in the currency's minor unit.
        type: integer
      currency:
        description: Currency is the currency code.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_cart_presentation_dto.QuantityRequest:
    properties:
      quantity:
        description: Quantity is the new positive whole number for the line.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.AdminCategoryResponse:
    properties:
      createdAt:
        description: CreatedAt is when the category was created.
        type: string
      description:
        description: Description is the text shown to customers; it may be empty.
        type: string
      id:
        description: ID is the category's stable identifier.
        type: string
      isVisible:
        description: IsVisible reports whether a customer can see the category.
        type: boolean
      name:
        description: Name is the name the operator wrote.
        type: string
      position:
        description: Position is the operator's ordering preference.
        type: integer
      slug:
        description: Slug is the link segment the operator wrote.
        type: string
      updatedAt:
        description: UpdatedAt is when the category was last written.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.CreateCategoryRequest:
    properties:
      description:
        description: |-
          Description is optional; an omitted or empty description is stored as
          empty.
        type: string
      name:
        description: Name is required; it is trimmed before it is stored.
        type: string
      position:
        description: |-
          Position is optional. An omitted or null position places the new
          category at the front of its list (FR-011); a supplied value is
          honoured. Any whole number, including zero and negative, is valid.
        type: integer
      slug:
        description: Slug is required; it must be URL-safe and is never derived from
          the name.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.PublicCategoryResponse:
    properties:
      description:
        description: Description may be empty; an empty description is valid.
        type: string
      id:
        description: ID is the category's stable public identifier.
        type: string
      name:
        description: Name is the name the operator wrote.
        type: string
      slug:
        description: Slug is the segment a customer-facing link is built from.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.ReorderCategoriesRequest:
    properties:
      categoryIds:
        description: CategoryIDs is every category's identifier, in the desired order.
        items:
          type: string
        type: array
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.ReorderResponse:
    properties:
      updatedCount:
        description: UpdatedCount is the number of records' positions that were written.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_category_presentation_dto.UpdateCategoryRequest:
    properties:
      description:
        description: Description is the new description; nil keeps the current value.
        type: string
      isVisible:
        description: |-
          IsVisible is the requested display state; nil keeps the current value. It
          is routed to the hide or show transition, never assigned directly.
        type: boolean
      name:
        description: Name is the new name; nil keeps the current value.
        type: string
      position:
        description: Position is the new position; nil keeps the current value.
        type: integer
      slug:
        description: Slug is the new slug; nil keeps the current value.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.AdjustmentRequest:
    properties:
      note:
        description: Note is an optional free-text note for the correction.
        type: string
      quantity:
        description: Quantity is the counted value; zero is valid.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.MovementResponse:
    properties:
      actorId:
        description: |-
          ActorID is the administrator who made a manual change, or null for a
          system-caused sale.
        type: string
      createdAt:
        description: CreatedAt is when the movement was written.
        type: string
      delta:
        description: Delta is the signed change.
        type: integer
      id:
        description: ID identifies the movement.
        type: string
      kind:
        description: 'Kind is the kind of change: RESTOCK, DAMAGE, ADJUSTMENT or SALE.'
        type: string
      note:
        description: Note is the optional note a manual change carries, or null.
        type: string
      resultingQuantity:
        description: ResultingQuantity is the physical quantity after the change.
        type: integer
      sourceReference:
        description: |-
          SourceReference is the outside event's identity, or null for a manual
          change.
        type: string
      variantId:
        description: VariantID is the variant whose quantity changed.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.QuantityRequest:
    properties:
      note:
        description: Note is an optional free-text note for the change.
        type: string
      quantity:
        description: Quantity is the positive whole number received or lost.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_inventory_presentation_dto.StockResponse:
    properties:
      availableQuantity:
        description: 'AvailableQuantity is the difference: what a customer can take.'
        type: integer
      heldQuantity:
        description: HeldQuantity is what active holds have set aside.
        type: integer
      physicalQuantity:
        description: PhysicalQuantity is what is on the shelf.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.AdminOrderResponse:
    properties:
      address:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderAddressResponse'
        description: Address is the delivery address snapshot.
      completedAt:
        description: |-
          CompletedAt is when the order completed; null before then (FR-014,
          research D11).
        type: string
      createdAt:
        description: CreatedAt is when the order was placed.
        type: string
      deliveredAt:
        description: |-
          DeliveredAt is when the operator marked the order delivered; null before
          delivery (FR-010, research D11).
        type: string
      deliveryPhotos:
        description: |-
          DeliveryPhotos is the dispatch and delivery evidence, ordered by stage then
          position; an order with none serialises `deliveryPhotos: []` (FR-010,
          research D11).
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.DeliveryPhotoResponse'
        type: array
      feedback:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.FeedbackResponse'
        description: |-
          Feedback is the customer's order-level feedback, or null (FR-015, FR-017,
          research D11).
      id:
        description: ID identifies the order.
        type: string
      itemCount:
        description: ItemCount is how many lines the order carries.
        type: integer
      lines:
        description: Lines are the order's snapshot lines, in position order.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderLineResponse'
        type: array
      status:
        description: Status is where the order is in its life.
        type: string
      total:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse'
        description: Total is the committed total.
      userId:
        description: UserID is the account that owns the order.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.AdminOrderSummaryResponse:
    properties:
      createdAt:
        description: CreatedAt is when the order was placed.
        type: string
      id:
        description: ID identifies the order.
        type: string
      itemCount:
        description: ItemCount is how many lines the order carries.
        type: integer
      status:
        description: Status is where the order is in its life.
        type: string
      total:
        allOf:
        - $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse'
        description: Total is the committed total.
      userId:
        description: UserID is the account that owns the order.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.CheckoutRequest:
    properties:
      addressId:
        description: AddressID is the address the customer named, or nil to use the
          default.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.DeliveryPhotoResponse:
    properties:
      height:
        type: integer
      id:
        description: ID identifies the photo.
        type: string
      position:
        description: Position is the order within its stage.
        type: integer
      stage:
        description: |-
          Stage is the delivery step the photo is evidence for (SHIPPING or
          DELIVERED).
        type: string
      url:
        description: URL is the displayable link to the stored image.
        type: string
      width:
        description: Width and Height are the stored pixel dimensions.
        type: integer
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.EditLineRequest:
    properties:
      quantity:
        description: Quantity is how many, at least 1.
        type: integer
      variantId:
        description: VariantID is the variant the line is for.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.EditOrderRequest:
    properties:
      addressId:
        description: AddressID is a saved address to deliver to; nil keeps the current
          one.
        type: string
      lines:
        description: Lines are the order's new lines; an empty set is refused.
        items:
          $ref: '#/definitions/github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.EditLineRequest'
        type: array
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.FeedbackRequest:
    properties:
      content:
        description: Content is the feedback text sent to the artist.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.FeedbackResponse:
    properties:
      content:
        description: Content is the feedback text.
        type: string
      createdAt:
        description: CreatedAt is when it was written.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.MoneyResponse:
    properties:
      amount:
        description: Amount is the amount in the currency's minor unit.
        type: integer
      currency:
        description: Currency is the currency code.
        type: string
    type: object
  github_com_mavil-chudomirovich_artist-shop-be_internal_modules_order_presentation_dto.OrderAddressResponse:
    properties:
      provinceCode:
        description: ProvinceCode and ProvinceName identify the first-level unit.
        type: string
      provinceName:
        type: string
      recipientName:
        description: RecipientName is the person the order goes to.
        type: string
      recipientPhone:
        description: RecipientPhone is the normalised recipient phone number.
        type: string
      streetAddress:
        description: StreetAddress is the free-text house number and street.
        type: string
      wardCode:
        description: WardCode and WardName identify the second-level unit.
        type: string
      wardName:
        type: string
    type: object
