openapi: 3.1.0
info:
  title: Artist Shop Backend — Password Reset (Emailed Code)
  version: 1.0.0
  description: >
    Password reset verified by an emailed one-time code. The request step emails a
    code; the verification step exchanges a correct code for a single-use reset
    token; the reset step changes the password and returns success without a session.
    Responses use the foundation envelope (data + meta, or error) and the
    X-Request-Id header.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/password/forgot:
    post:
      summary: Email a one-time password-reset code
      description: >
        Requests a reset for an address. Always answers with the same generic
        acknowledgement; emails a code only if the address has an account. The email
        never contains the reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Generic acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Rate limited, or the resend cooldown is still active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The code could not be delivered; a new request can be made immediately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password/forgot/verify-otp:
    post:
      summary: Verify the reset code and receive a reset token
      description: >
        Verifies the emailed code. On success a single-use reset token is created and
        returned; the code can no longer be used. The token is not a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyResetOTPRequest"
      responses:
        "200":
          description: Code verified; a reset token was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetTokenEnvelope"
        "400":
          description: The code is wrong or expired, or the email is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The code attempt limit was reached, or the flow rate limit was exceeded (`AUTH_OTP_TOO_MANY_ATTEMPTS` / `RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password/reset:
    post:
      summary: Set a new password with the reset token
      description: >
        Changes the password, consumes the token, ends every session of the account and
        rejects previously issued access tokens. Returns success only; it does not sign
        the user in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRequest"
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          description: The token is invalid, used, expired, or the password fails the policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: A field failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    VerifyResetOTPRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: "^[0-9]{6}$"
    ResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: The reset token returned by verify-otp.
        newPassword:
          type: string
          minLength: 8
    ResetToken:
      type: object
      required: [resetToken, expiresIn]
      properties:
        resetToken:
          type: string
          description: Single-use token whose only purpose is to set a new password.
        expiresIn:
          type: integer
          description: Seconds until the reset token expires.
    ResetTokenEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ResetToken"
        meta:
          $ref: "#/components/schemas/Meta"
    MessageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          properties:
            message:
              type: string
        meta:
          $ref: "#/components/schemas/Meta"
    Meta:
      type: object
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            requestId:
              type: string
