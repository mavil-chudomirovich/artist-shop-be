name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static:
        name: Format and Tidy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.26
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Check formatting
              run: make fmt-check

            - name: Check go.mod / go.sum are tidy
              run: make tidy-check

    vet:
        name: Go Vet
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.26
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run go vet
              run: make vet

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.26
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
                  cache-dependency-path: go.sum

            # v2 is required because go.mod targets a newer Go than the
            # golangci-lint v1 line was built with; action v9 supports v2.
            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.14.0

    build:
        name: Build Binaries
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.26
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Build
              run: make build

    test:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.26
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run tests
              run: make test

    test-integration:
        name: Integration Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.26
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run integration tests
              run: make test-integration

    test-race:
        name: Race Detector Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Go 1.26
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
                  cache-dependency-path: go.sum

            - name: Run race detector tests
              run: make test-race