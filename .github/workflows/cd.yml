name: CD - VPS

# Production only. There is no staging environment: a release is either a
# version tag or a manual dispatch that builds the current commit.
#
#   git tag -a v0.1.0 -m "Release v0.1.0" && git push origin v0.1.0
#
# Deploys to the shared VPS under /opt/artist-shop. Images are pushed to GHCR
# and pinned by digest in /opt/artist-shop/.env.deploy before rollout.

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

permissions:
    contents: read
    packages: write

concurrency:
    group: artist-shop-vps-production
    cancel-in-progress: false

env:
    IMAGE: ghcr.io/mavil-chudomirovich/artist-shop-be
    REMOTE_DIR: /opt/artist-shop

jobs:
    build-push:
        name: Build and push image
        runs-on: ubuntu-latest
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push immutable image
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:${{ github.sha }}
                      ${{ env.IMAGE }}:latest
                  cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
                  cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

    deploy:
        name: Deploy to VPS
        needs: build-push
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Prepare SSH
              shell: bash
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Upload deployment files
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
              run: |
                  tar -czf /tmp/artist-shop-deploy.tar.gz \
                    docker-compose.prod.yml \
                    nginx/prod.conf \
                    deployments/scripts/issue-certs.sh \
                    deployments/scripts/renew-certs.sh \
                    scripts/seed_admin.sql
                  scp -P "${DEPLOY_PORT}" /tmp/artist-shop-deploy.tar.gz \
                    "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/artist-shop-deploy.tar.gz"

            - name: Install deployment files
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
                  REMOTE_DIR: ${{ env.REMOTE_DIR }}
              run: |
                  ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                    "set -e; mkdir -p '${REMOTE_DIR}'; \
                     tar -xzf /tmp/artist-shop-deploy.tar.gz -C '${REMOTE_DIR}'; \
                     rm -f /tmp/artist-shop-deploy.tar.gz"

            - name: Log VPS in to GHCR
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
                  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
                  GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
              run: |
                  printf '%s' "${GHCR_READ_TOKEN}" | \
                    ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                    "docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"

            - name: Pin image, migrate and roll out
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
                  IMAGE: ${{ env.IMAGE }}
                  DIGEST: ${{ needs.build-push.outputs.digest }}
                  REMOTE_DIR: ${{ env.REMOTE_DIR }}
              run: |
                  set -euo pipefail
                  image_ref="${IMAGE}@${DIGEST}"

                  ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                    "set -e
                     cd '${REMOTE_DIR}'
                     touch .env.deploy
                     grep -v '^API_IMAGE=' .env.deploy > .env.deploy.next || true
                     printf 'API_IMAGE=%s\\n' '${image_ref}' >> .env.deploy.next
                     mv .env.deploy.next .env.deploy
                     chmod 600 .env.deploy
                     docker compose --env-file .env.production --env-file .env.deploy -f docker-compose.prod.yml config >/dev/null
                     docker compose --env-file .env.production --env-file .env.deploy -f docker-compose.prod.yml pull api
                     docker compose --env-file .env.production --env-file .env.deploy -f docker-compose.prod.yml --profile migrate run --rm migrate
                     docker compose --env-file .env.production --env-file .env.deploy -f docker-compose.prod.yml up -d api
                     docker compose --env-file .env.production --env-file .env.deploy -f docker-compose.prod.yml up -d --force-recreate nginx
                     docker compose --env-file .env.production --env-file .env.deploy -f docker-compose.prod.yml ps"

    smoke:
        name: Smoke test
        needs: deploy
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Prepare SSH
              shell: bash
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Wait for the API container healthcheck
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
                  REMOTE_DIR: ${{ env.REMOTE_DIR }}
              run: |
                  for _ in $(seq 1 12); do
                    status=$(ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                      "cd '${REMOTE_DIR}' && id=\$(docker compose --env-file .env.production --env-file .env.deploy -f docker-compose.prod.yml ps -q api); \
                       test -n \"\$id\"; \
                       docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \"\$id\"" || true)
                    if [[ "${status}" == "healthy" ]]; then
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "Smoke test failed: api container did not become healthy"
                  exit 1

            - name: Check public health endpoints through nginx
              shell: bash
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
              run: |
                  for _ in $(seq 1 12); do
                    if ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                      "curl --fail --silent --show-error --max-time 15 \
                       --resolve api.sumichi.hycat.online:8445:127.0.0.1 \
                       https://api.sumichi.hycat.online:8445/healthz >/dev/null \
                       && curl --fail --silent --show-error --max-time 15 \
                       --resolve api.sumichi.hycat.online:8445:127.0.0.1 \
                       https://api.sumichi.hycat.online:8445/readyz >/dev/null"; then
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "Public health check through nginx failed"
                  exit 1

