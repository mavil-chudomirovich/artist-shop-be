# Developer overrides, layered on top of docker-compose.yml.
#
#   make up-tools
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Publishes the backing services on localhost so you can inspect them with a
# GUI client or psql, and adds Mailpit as a local SMTP sink for OTP and
# password-reset emails.
#
# The api service is pointed at Mailpit here rather than in .env, so the
# credentials .env holds for a real provider stay untouched and a container
# never tries to reach one. This is the container half of the local mail setup;
# the host half is .env.local, because the host reaches Mailpit at localhost
# while a container reaches it at the service name.

services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  api:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Mailpit needs no credentials and accepts any sender, so the provider's
      # are cleared rather than offered to a server that does not want them.
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  # Opt-in public tunnel for testing provider webhooks (PayOS, module 08). It is
  # behind the "ngrok" profile so `make up-tools` never starts it: a missing
  # NGROK_AUTHTOKEN would otherwise fail the stack. Run it with
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile ngrok up -d ngrok
  # NGROK_DOMAIN is the reserved domain the tunnel answers on (set it in .env);
  # read the public URL from the dashboard at http://localhost:4040, then register
  # it as the PayOS webhook (docs/development/payment-testing.md).
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["ngrok"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http api:8080 --url https://${NGROK_DOMAIN} --log stdout
    ports:
      - "127.0.0.1:${NGROK_DASHBOARD_PORT:-4040}:4040"
    restart: unless-stopped
