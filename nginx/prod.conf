# Production reverse proxy for artist-shop-be.
#
# Rendered by the nginx image entrypoint (envsubst) from
# /etc/nginx/templates/default.conf.template. Only ${API_DOMAIN} and
# ${HTTPS_PORT} are substituted (see NGINX_ENVSUBST_FILTER in
# docker-compose.prod.yml).

server {
    listen 80;
    server_name ${API_DOMAIN};
    server_tokens off;
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}

server {
    listen 443 ssl;
    server_name ${API_DOMAIN};
    server_tokens off;

    ssl_certificate /etc/nginx/tls/${API_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/${API_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Matches MAX_BODY_BYTES (12 MiB); the application enforces the real
    # limits per route.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /healthz {
        proxy_pass http://api:8080;
    }

    location = /readyz {
        proxy_pass http://api:8080;
    }

    location /api/ {
        proxy_pass http://api:8080;
    }

    # Swagger UI is disabled in production (SWAGGER_ENABLED=false), so the
    # route does not exist; the generated spec under docs/swagger stays
    # available for offline review.
    location / {
        return 404;
    }
}
